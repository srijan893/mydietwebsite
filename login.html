{% extends "base.html" %}
{% block title %}Login — Muscle Meal Plan{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card border-0 shadow-sm p-4">
      <h3 class="fw-bold mb-1 text-center">Welcome Back</h3>
      <p class="text-muted text-center mb-4">Log in to your account</p>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Email address</label>
          <input type="email" name="email" class="form-control form-control-lg" placeholder="you@example.com" required />
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="password" class="form-control form-control-lg" placeholder="Your password" required />
        </div>
        <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold">Log In</button>
      </form>
      <hr class="my-3" />
      <p class="text-center text-muted mb-0">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
    </div>
  </div>
</div>
{% endblock %}
